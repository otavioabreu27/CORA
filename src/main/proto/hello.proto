syntax = "proto3";

option java_multiple_files = true;
option java_package = "inpe.ccs.l1servicetemplate";
option java_outer_classname = "HelloGrpcProto";

package inpe.ccs.l1servicetemplate.v1;

service HelloGrpc {
    rpc SayHello (HelloRequest) returns (HelloReply) {}
}

message HelloRequest {
    string name = 1;
}

message HelloReply {
    string message = 1;
}
