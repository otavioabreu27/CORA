# Identity is injected by Gradle processResources.
quarkus.application.name=@serviceName@
quarkus.application.version=@serviceVersion@
service.level=@serviceLevel@

# HTTP: example REST endpoint, health and Prometheus. gRPC: dedicated HTTP/2 port.
quarkus.http.port=${HTTP_PORT:8080}
quarkus.grpc.server.port=${GRPC_PORT:9000}
quarkus.grpc.server.test-port=${GRPC_TEST_PORT:9001}
# Packaged integration tests run in normal launch mode with the test profile.
%test.quarkus.grpc.server.port=${quarkus.grpc.server.test-port}
%dev.quarkus.grpc.server.enable-reflection-service=true

# PostgreSQL Dev Services uses a disposable database in dev/test.
quarkus.datasource.db-kind=postgresql
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.hibernate-orm.schema-management.strategy=validate

# Metrics are pulled by Prometheus from /q/metrics on the HTTP port.
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.grpc-server.enabled=true
quarkus.micrometer.binder.grpc-client.enabled=true
quarkus.datasource.metrics.enabled=true

# RabbitMQ client is available; domain events and connection lifecycle are service-specific.
# Opt in when the service implements messaging; disabled clients do not affect readiness.
quarkus.rabbitmqclient.client-enabled=${RABBITMQ_ENABLED:false}
quarkus.rabbitmqclient.uri=${RABBITMQ_URI:amqp://guest:guest@localhost:5672/%2f}
