name: CI / CD

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Finish publications; superseded feature/PR runs can be cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/development' }}

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.event_name != 'push' || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/development') }}
      - name: Run tests with disposable PostgreSQL (Dev Services)
        run: ./gradlew --no-daemon --stacktrace test
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 14
          if-no-files-found: warn

  publish:
    name: Publish ${{ github.ref_name == 'main' && 'native' || 'JVM' }} image
    needs: tests
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      # Mandrel is the Quarkus-oriented GraalVM distribution. UBI 9 matches the runtime.
      # Pinned linux/amd64 JDK 25 builder; review this digest when upgrading Quarkus/JDK.
      QUARKUS_NATIVE_BUILDER_IMAGE: quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25@sha256:50ce63f80dabf588d0e3c43857ae9d1a981d78a3e9ff42579965be23d47254c7
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Package JVM application
        if: github.ref == 'refs/heads/development'
        run: ./gradlew --no-daemon --stacktrace quarkusBuild -Dquarkus.native.enabled=false -Dquarkus.package.jar.type=fast-jar
      - name: Compile native executable and run packaged tests
        if: github.ref == 'refs/heads/main'
        run: >-
          ./gradlew --no-daemon --stacktrace testNative
          -Dquarkus.native.enabled=true
          -Dquarkus.package.jar.enabled=false
          -Dquarkus.native.container-build=true
          -Dquarkus.native.native-image-xmx=4g
          -Dquarkus.native.additional-build-args=-march=compatibility
          -Dquarkus.test.integration-test-profile=test
      - name: Save native test reports
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/tests/testNative/
            build/test-results/testNative/
          retention-days: 14
          if-no-files-found: warn
      - name: Select image and Dockerfile
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          if [[ "$BRANCH" == main ]]; then
            mode=native
            dockerfile=src/main/docker/Dockerfile.native-micro
          else
            mode=jvm
            dockerfile=src/main/docker/Dockerfile.jvm
          fi
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "revision_tag=$mode-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$dockerfile" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish container
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ steps.image.outputs.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.revision_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}
      - name: Record published digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ steps.image.outputs.tag }}
          REVISION_TAG: ${{ steps.image.outputs.revision_tag }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            echo '### Published image'
            echo "- Branch tag: \`$IMAGE:$TAG\`"
            echo "- Commit tag: \`$IMAGE:$REVISION_TAG\`"
            echo "- Deployment reference: \`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
